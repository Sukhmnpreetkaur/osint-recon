[project]
name = "osint-recon"
version = "1.0.0"
description = "OSINT & Digital Footprinting CLI Tool"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "rich>=13.7.0",
    "click>=8.1.7",
    "dnspython>=2.4.2",
    "python-whois>=0.9.4",
    "phonenumbers>=8.13.0",
    "Pillow>=10.2.0",
    "PyPDF2>=3.0.1",
    "beautifulsoup4>=4.12.0",
    "aiohttp>=3.9.0",
    "asyncio-pool>=0.6.0",
]

[project.scripts]
osint = "osint_recon.cli:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
